[workspace]
members = ["xtask"]
resolver = "2"

[workspace.package]
version = "1.0.4"
license = "GPL-2.0-or-later"
edition = "2024"
repository = "https://github.com/chenxiaolong/afsr"
publish = false

[package]
name = "afsr"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.79"
base64 = "0.23.1"
bstr = "1.9.1"
cap-std = "4.0.3"
clap = { version = "4.4.16", features = ["derive"] }
jiff = { version = "0.2.1", features = ["serde", "std"], default-features = false }
libc = "0.2.189"
num-traits = "0.2.19"
serde = { version = "1.0.203", features = ["derive"] }
tar = "0.4.46"
tempfile = "3.10.1"
toml_edit = { version = "0.25.13", features = ["serde"] }
urlencoding = "2.1.3"
uuid = { version = "1.8.0", features = ["serde"] }

[build-dependencies]
bindgen = "0.72.1"
cc = { version = "1.1.10", features = ["jobserver", "parallel"] }
embed-manifest = "1.4.0"
