on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    name: Build afsr
    runs-on: ${{ matrix.artifact.os }}
    env:
      CARGO_TERM_COLOR: always
      # https://github.com/rust-lang/rust/issues/78210
      RUSTFLAGS: -C strip=symbols -C target-feature=+crt-static
      # https://github.com/rust-lang/cargo/pull/15462
      RUSTDOCFLAGS: -C target-feature=+crt-static
      TARGETS: ${{ join(matrix.artifact.targets, ' ') || matrix.artifact.name }}
      ANDROID_API: ${{ matrix.artifact.android_api }}
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - os: ubuntu-latest
            name: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            name: aarch64-unknown-linux-gnu
          - os: windows-latest
            name: x86_64-pc-windows-gnu
          - os: windows-11-arm
            name: aarch64-pc-windows-gnullvm
          - os: macos-latest
            name: universal-apple-darwin
            targets:
              - aarch64-apple-darwin
              - x86_64-apple-darwin
            combine: lipo
          - os: ubuntu-latest
            name: aarch64-linux-android31
            targets:
              - aarch64-linux-android
            android_api: '31'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For git describe
          fetch-depth: 0
          submodules: true

      - name: Update Rust
        run: rustup update stable

      - name: Install cargo-android
        shell: bash
        run: |
          cargo install \
              --git https://github.com/chenxiaolong/cargo-android \
              --tag v0.1.6

      - name: Install llvm-mingw
        if: matrix.artifact.os == 'windows-11-arm'
        shell: bash
        run: |
          version=20251021
          curl -fLO "https://github.com/mstorsjo/llvm-mingw/releases/download/${version}/llvm-mingw-${version}-ucrt-aarch64.zip"
          7z x "llvm-mingw-${version}-ucrt-aarch64.zip"
          echo "$(pwd -W)/llvm-mingw-${version}-ucrt-aarch64/bin" >> "${GITHUB_PATH}"

      - name: Get version
        id: get_version
        shell: bash
        run: |
          echo -n 'version=' >> "${GITHUB_OUTPUT}"
          git describe --always \
              | sed -E "s/^v//g;s/([^-]*-g)/r\1/;s/-/./g" \
              >> "${GITHUB_OUTPUT}"

      - name: Install toolchains
        shell: bash
        run: |
          for target in ${TARGETS}; do
              rustup target add "${target}"
          done

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        shell: bash
        run: |
          for target in ${TARGETS}; do
              cargo android \
                  clippy --release \
                  --target "${target}"
          done

      - name: Formatting
        run: cargo fmt -- --check

      - name: Build
        shell: bash
        run: |
          for target in ${TARGETS}; do
              cargo android \
                  build --release \
                  --target "${target}"
          done

      - name: Create output directory
        shell: bash
        run: |
          rm -rf target/output

          case "${{ matrix.artifact.combine }}" in
          lipo)
              mkdir target/output
              cmd=(lipo -output target/output/afsr -create)
              for target in ${TARGETS}; do
                  cmd+=("target/${target}/release/afsr")
              done
              "${cmd[@]}"
              ;;
          '')
              ln -s "${TARGETS}/release" target/output
              ;;
          *)
              echo >&2 "Unsupported combine argument"
              exit 1
              ;;
          esac

      - name: Archive artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afsr-${{ steps.get_version.outputs.version }}-${{ matrix.artifact.name }}
          path: |
            target/output/afsr
            target/output/afsr.exe
